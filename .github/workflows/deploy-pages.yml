name: Deploy to GitHub Pages (RETIRED)

# THIS REPOSITORY IS RETIRED.
#
# It used to mirror main into gh-pages on every push. The live site is
# mcclusterishere/mccluster -> matthew.mccluster.org, and this repo is no
# longer part of it. The trigger is manual-only now so a push here cannot
# republish anything, and the one job refuses on purpose.
#
# Whatever is already on gh-pages stays exactly as it is. Nothing is
# deleted; it is simply frozen.

on:
  workflow_dispatch: {}

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Do not deploy from a retired repository
        run: |
          echo "McCluster-Portfolio is retired."
          echo "The live site deploys from mcclusterishere/mccluster."
          echo "Refusing to publish."
          exit 1
